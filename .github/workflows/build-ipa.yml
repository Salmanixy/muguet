name: Build Muguet IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check build requirements
        run: |
          xcodebuild -version
          rustup toolchain list
          xcodegen --version
      - name: Build IPA
        env:
          FREE: "1"
          BUNDLE_ID: com.salmanixy.muguet
        run: |
          chmod +x make-ios.sh
          ./make-ios.sh --help || true
          echo "Inspecting the build script for required game assets."
          sed -n '1,240p' make-ios.sh
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muguet-build-logs
          path: |
            build/
          if-no-files-found: warn
          retention-days: 7
