name: Build Muguet IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - name: Inspect Muguet build instructions
        run: |
          echo "===== Repository files ====="
          ls -la
          echo "===== Build script ====="
          sed -n '1,280p' make-ios.sh
          echo "===== README build instructions ====="
          grep -n -i -A 8 -B 4 "make-ios\|game.zip\|--ipa" README.md || true
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Muguet-Build-Diagnostics
          path: |
            make-ios.sh
            README.md
          if-no-files-found: warn
          retention-days: 7
