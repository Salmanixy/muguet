name: Build Muguet IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - name: Inspect build script
        run: |
          ls -la
          sed -n '1,240p' make-ios.sh
      - name: Build IPA
        env:
          FREE: "1"
          BUNDLE_ID: com.salmanixy.muguet
        run: |
          echo "The required game ZIP must be supplied before building."
          echo "See the Inspect build script step for the expected arguments."
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muguet-build-output
          path: |
            *.ipa
            build/
            dist/
          if-no-files-found: warn
