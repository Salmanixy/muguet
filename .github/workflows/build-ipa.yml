name: Build Muguet IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - name: Inspect project
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name 'make-ios.sh' -o -name 'Cargo.toml'
      - name: Check build script
        run: |
          chmod +x make-ios.sh
          sed -n '1,240p' make-ios.sh
      - name: Build IPA
        env:
          FREE: "1"
          BUNDLE_ID: com.salmanixy.muguet
        run: |
          set -euxo pipefail
          ./make-ios.sh --help || true
      - name: Find generated IPA
        if: always()
        run: |
          find . -type f -name '*.ipa' -print
          find build -maxdepth 4 -type f -print 2>/dev/null || true
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Muguet-IPA
          path: |
            **/*.ipa
          if-no-files-found: error
          retention-days: 7
